[project]
name = "devopscoach"
version = "0.1.1"
description = "An example Flask app running in Docker."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.17.2",
  "beautifulsoup4==4.12.3",
  "celery==5.5.3",
  "email-validator==2.1.1",
  "flask==3.1.2",
  "flask-bcrypt==1.0.1",
  "flask-db==0.4.1",
  "flask-debugtoolbar==0.16.0",
  "flask-login==0.6.3",
  "flask-mail==0.10.0",
  "flask-migrate==4.0.7",
  "flask-secrets==0.1.0",
  "flask-sqlalchemy==3.1.1",
  "flask-static-digest==0.4.1",
  "flask-wtf==1.2.2",
  "gunicorn==23.0.0",
  "jinja2==3.1.6",
  "openai==2.30.0",
  "psycopg==3.2.12",
  "pytest==9.0.1",
  "pytest-cov==7.0.0",
  "redis==7.0.1",
  "requests==2.32.3",
  "ruff==0.14.5",
  "setuptools==80.9.0",
  "sqlalchemy==2.0.44",
  "sqlalchemy-utils==0.42.0",
  "tavily-python==0.5.0",
  "werkzeug==3.1.3",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["I", "SIM"]
