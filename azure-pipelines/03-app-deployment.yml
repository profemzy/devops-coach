# =============================================================================
# Pipeline: 03-app-deployment.yml
# Purpose: Build Docker image and deploy to AKS
# Triggers: Changes to application code
# =============================================================================

trigger:
  branches:
    include:
      - master
      - main
  paths:
    include:
      - devopscoach/**
      - config/**
      - Dockerfile
      - k8s/**
      - assets/**
      - pyproject.toml
      - .env.example

pr:
  branches:
    include:
      - master
      - main

variables:
  # Container Registry
  acrLoginServer: "wackopscoachdevacr.azurecr.io"
  acrLoginServerProd: "wackopscoachprodacr.azurecr.io"
  acrServiceConnection: "wackops-acr-connection"
  
  # Kubernetes
  aksServiceConnection: "wackops-aks-connection"
  
  # Image Configuration
  imageRepository: "wackops-coach"
  dockerfilePath: "$(Build.SourcesDirectory)/Dockerfile"
  
  # Build ID as tag
  tag: "$(Build.BuildId)"
  latestTag: "latest"

stages:
  # ==========================================================================
  # Stage 1: Build and Push Docker Image
  # ==========================================================================
  - stage: Build
    displayName: "📦 Build & Push"
    jobs:
      - job: Build_and_Push
        displayName: "Build & Push Docker Image"
        pool:
          vmImage: "ubuntu-24.04"
        steps:
          - checkout: self
            displayName: "Checkout Source Code"

          # Build and push Docker image to ACR
          - task: Docker@2
            displayName: "Build and Push Image"
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: $(imageRepository)
              command: "buildAndPush"
              Dockerfile: $(dockerfilePath)
              tags: |
                $(tag)
                $(latestTag)
              arguments: "--target app"

          # Update Kubernetes manifests with new image tag for DEV
          - task: Bash@3
            displayName: "Update DEV K8s Manifests"
            inputs:
              targetType: "inline"
              script: |
                echo "Updating DEV Kubernetes manifests with image tag: $(tag)"
                sed -i "s|image:.*wackops-coach:.*|image: $(acrLoginServer)/$(imageRepository):$(tag)|g" k8s/dev/deployment.yaml
                sed -i "s|image:.*wackops-coach:.*|image: $(acrLoginServer)/$(imageRepository):$(tag)|g" k8s/dev/worker-deployment.yaml
                cat k8s/dev/deployment.yaml | grep "image:"

          # Update Kubernetes manifests with new image tag for PROD
          - task: Bash@3
            displayName: "Update PROD K8s Manifests"
            inputs:
              targetType: "inline"
              script: |
                echo "Updating PROD Kubernetes manifests with image tag: $(tag)"
                sed -i "s|image:.*wackops-coach:.*|image: $(acrLoginServerProd)/$(imageRepository):$(tag)|g" k8s/prod/deployment.yaml
                sed -i "s|image:.*wackops-coach:.*|image: $(acrLoginServerProd)/$(imageRepository):$(tag)|g" k8s/prod/worker-deployment.yaml
                cat k8s/prod/deployment.yaml | grep "image:"

          # Publish Kubernetes manifests as artifact
          - task: PublishBuildArtifacts@1
            displayName: "Publish K8s Manifests"
            inputs:
              PathtoPublish: "$(System.DefaultWorkingDirectory)/k8s"
              ArtifactName: "kubernetes-manifests"
              publishLocation: "Container"

  # ==========================================================================
  # Stage 2: Deploy to DEV
  # ==========================================================================
  - stage: Deploy_DEV
    displayName: "🚀 Deploy to DEV"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: Deploy_AKS_DEV
        displayName: "Deploy to AKS DEV"
        pool:
          vmImage: "ubuntu-24.04"
        environment: "dev"
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: kubernetes-manifests

                - task: KubernetesManifest@1
                  displayName: "Deploy to DEV AKS"
                  inputs:
                    action: "deploy"
                    connectionType: "azureResourceManager"
                    azureSubscriptionEndpoint: $(aksServiceConnection)
                    azureResourceGroup: "wackopscoach-dev-rg"
                    kubernetesCluster: "wackopscoach-dev-aks"
                    namespace: "wackops-coach"
                    manifests: |
                      $(Pipeline.Workspace)/kubernetes-manifests/dev/namespace.yaml
                      $(Pipeline.Workspace)/kubernetes-manifests/dev/redis.yaml
                      $(Pipeline.Workspace)/kubernetes-manifests/dev/secret.yaml
                      $(Pipeline.Workspace)/kubernetes-manifests/dev/migration-job.yaml
                      $(Pipeline.Workspace)/kubernetes-manifests/dev/deployment.yaml
                      $(Pipeline.Workspace)/kubernetes-manifests/dev/worker-deployment.yaml
                      $(Pipeline.Workspace)/kubernetes-manifests/dev/service.yaml
                      $(Pipeline.Workspace)/kubernetes-manifests/dev/ingress.yaml
                    containers: |
                      $(acrLoginServer)/$(imageRepository):$(tag)

                - task: Kubernetes@1
                  displayName: "Wait for Migration Job"
                  inputs:
                    connectionType: "Azure Resource Manager"
                    azureSubscriptionEndpoint: $(aksServiceConnection)
                    azureResourceGroup: "wackopscoach-dev-rg"
                    kubernetesCluster: "wackopscoach-dev-aks"
                    namespace: "wackops-coach"
                    command: "wait"
                    arguments: "--for=condition=complete --timeout=300s job/wackops-coach-migration"
                  continueOnError: true

                - task: Kubernetes@1
                  displayName: "Rollout Status"
                  inputs:
                    connectionType: "Azure Resource Manager"
                    azureSubscriptionEndpoint: $(aksServiceConnection)
                    azureResourceGroup: "wackopscoach-dev-rg"
                    kubernetesCluster: "wackopscoach-dev-aks"
                    namespace: "wackops-coach"
                    command: "rollout"
                    arguments: "status deployment/wackops-coach --timeout=300s"

                - task: Bash@3
                  displayName: "Verify DEV Deployment"
                  inputs:
                    targetType: "inline"
                    script: |
                      echo "Verifying DEV deployment at https://dev.wackops.xyz"
                      sleep 10
                      curl -sf https://dev.wackops.xyz/up || exit 1
                      echo "✅ DEV deployment verified successfully!"

  # ==========================================================================
  # Stage 3: Deploy to PROD (Requires Approval)
  # ==========================================================================
  - stage: Deploy_PROD
    displayName: "🚀 Deploy to PROD"
    dependsOn: Deploy_DEV
    condition: succeeded()
    jobs:
      - deployment: Deploy_AKS_PROD
        displayName: "Deploy to AKS PROD"
        pool:
          vmImage: "ubuntu-24.04"
        environment: "prod"
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: kubernetes-manifests

                - task: KubernetesManifest@1
                  displayName: "Deploy to PROD AKS"
                  inputs:
                    action: "deploy"
                    connectionType: "azureResourceManager"
                    azureSubscriptionEndpoint: $(aksServiceConnection)
                    azureResourceGroup: "wackopscoach-prod-rg"
                    kubernetesCluster: "wackopscoach-prod-aks"
                    namespace: "wackops-coach"
                    manifests: |
                      $(Pipeline.Workspace)/kubernetes-manifests/prod/namespace.yaml
                      $(Pipeline.Workspace)/kubernetes-manifests/prod/redis.yaml
                      $(Pipeline.Workspace)/kubernetes-manifests/prod/secret.yaml
                      $(Pipeline.Workspace)/kubernetes-manifests/prod/migration-job.yaml
                      $(Pipeline.Workspace)/kubernetes-manifests/prod/deployment.yaml
                      $(Pipeline.Workspace)/kubernetes-manifests/prod/worker-deployment.yaml
                      $(Pipeline.Workspace)/kubernetes-manifests/prod/service.yaml
                      $(Pipeline.Workspace)/kubernetes-manifests/prod/ingress.yaml
                    containers: |
                      $(acrLoginServerProd)/$(imageRepository):$(tag)

                - task: Kubernetes@1
                  displayName: "Wait for Migration Job"
                  inputs:
                    connectionType: "Azure Resource Manager"
                    azureSubscriptionEndpoint: $(aksServiceConnection)
                    azureResourceGroup: "wackopscoach-prod-rg"
                    kubernetesCluster: "wackopscoach-prod-aks"
                    namespace: "wackops-coach"
                    command: "wait"
                    arguments: "--for=condition=complete --timeout=300s job/wackops-coach-migration"
                  continueOnError: true

                - task: Kubernetes@1
                  displayName: "Rollout Status"
                  inputs:
                    connectionType: "Azure Resource Manager"
                    azureSubscriptionEndpoint: $(aksServiceConnection)
                    azureResourceGroup: "wackopscoach-prod-rg"
                    kubernetesCluster: "wackopscoach-prod-aks"
                    namespace: "wackops-coach"
                    command: "rollout"
                    arguments: "status deployment/wackops-coach --timeout=300s"

                - task: Bash@3
                  displayName: "Verify PROD Deployment"
                  inputs:
                    targetType: "inline"
                    script: |
                      echo "Verifying PROD deployment at https://wackops.xyz"
                      sleep 10
                      curl -sf https://wackops.xyz/up || exit 1
                      echo "✅ PROD deployment verified successfully!"
