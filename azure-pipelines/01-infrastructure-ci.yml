# =============================================================================
# Pipeline: 01-infrastructure-ci.yml
# Purpose: CI Pipeline for Terraform Infrastructure
# Triggers: Changes to infrastructure/ folder
# =============================================================================

trigger:
  branches:
    include:
      - master
      - main
  paths:
    include:
      - infrastructure/**
      - azure-pipelines/01-infrastructure-ci.yml
      - azure-pipelines/02-infrastructure-cd.yml

pr:
  branches:
    include:
      - master
      - main
  paths:
    include:
      - infrastructure/**

variables:
  # Terraform version
  tf_version: "1.10.0"
  
  # Azure Service Connection
  azureServiceConnection: "terraformiacdevops1"
  
  # Terraform State Storage
  backendResourceGroup: "terraform-storage-rg"
  backendStorageAccount: "terraformstatewakopsaks"
  backendContainerName: "tfstatefiles"
  
  # Azure Authentication
  ARM_SUBSCRIPTION_ID: "675ec6f5-d0e6-4d1e-a3b5-f9c3f3508ba5"
  ARM_TENANT_ID: "c108f6b2-fea0-4910-adfa-1a9ab4d3bffd"

stages:
  # ==========================================================================
  # Stage 1: Validate Terraform Code
  # ==========================================================================
  - stage: Validate
    displayName: "🔍 Validate Terraform"
    jobs:
      - job: Terraform_Validate
        displayName: "Terraform Format & Validate"
        pool:
          vmImage: "ubuntu-24.04"
        steps:
          # Checkout code
          - checkout: self
            displayName: "Checkout Repository"

          # Install Terraform
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: $(tf_version)

          # Terraform Format Check
          - task: TerraformTaskV4@4
            displayName: "Terraform Format Check"
            inputs:
              provider: "azurerm"
              command: "custom"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infrastructure/terraform"
              customCommand: "fmt"
              environmentServiceNameAzureRM: $(azureServiceConnection)
              outputVariables: true

          # Terraform Init
          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infrastructure/terraform"
              backendServiceArm: $(azureServiceConnection)
              backendAzureRmResourceGroupName: $(backendResourceGroup)
              backendAzureRmStorageAccountName: $(backendStorageAccount)
              backendAzureRmContainerName: $(backendContainerName)
              backendAzureRmKey: "infrastructure.tfstate"

          # Terraform Validate
          - task: TerraformTaskV4@4
            displayName: "Terraform Validate"
            inputs:
              provider: "azurerm"
              command: "validate"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infrastructure/terraform"

  # ==========================================================================
  # Stage 2: Plan for All Environments
  # ==========================================================================
  - stage: Plan_All_Environments
    displayName: "📋 Plan All Environments"
    dependsOn: Validate
    condition: succeeded()
    jobs:
      # DEV Plan
      - job: Plan_DEV
        displayName: "Plan DEV"
        pool:
          vmImage: "ubuntu-24.04"
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(tf_version)
          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infrastructure/terraform"
              backendServiceArm: $(azureServiceConnection)
              backendAzureRmResourceGroupName: $(backendResourceGroup)
              backendAzureRmStorageAccountName: $(backendStorageAccount)
              backendAzureRmContainerName: $(backendContainerName)
              backendAzureRmKey: "dev-terraform.tfstate"
          - task: TerraformTaskV4@4
            displayName: "Terraform Plan DEV"
            inputs:
              provider: "azurerm"
              command: "plan"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infrastructure/terraform"
              commandOptions: "-var-file=dev.tfvars -out=dev.tfplan"
              environmentServiceNameAzureRM: $(azureServiceConnection)
          - task: PublishBuildArtifacts@1
            displayName: "Publish DEV Plan"
            inputs:
              PathtoPublish: "$(System.DefaultWorkingDirectory)/infrastructure/terraform/dev.tfplan"
              ArtifactName: "terraform-plan-dev"
              publishLocation: "Container"

      # PROD Plan
      - job: Plan_PROD
        displayName: "Plan PROD"
        pool:
          vmImage: "ubuntu-24.04"
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(tf_version)
          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infrastructure/terraform"
              backendServiceArm: $(azureServiceConnection)
              backendAzureRmResourceGroupName: $(backendResourceGroup)
              backendAzureRmStorageAccountName: $(backendStorageAccount)
              backendAzureRmContainerName: $(backendContainerName)
              backendAzureRmKey: "prod-terraform.tfstate"
          - task: TerraformTaskV4@4
            displayName: "Terraform Plan PROD"
            inputs:
              provider: "azurerm"
              command: "plan"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infrastructure/terraform"
              commandOptions: "-var-file=prod.tfvars -out=prod.tfplan"
              environmentServiceNameAzureRM: $(azureServiceConnection)
          - task: PublishBuildArtifacts@1
            displayName: "Publish PROD Plan"
            inputs:
              PathtoPublish: "$(System.DefaultWorkingDirectory)/infrastructure/terraform/prod.tfplan"
              ArtifactName: "terraform-plan-prod"
              publishLocation: "Container"
