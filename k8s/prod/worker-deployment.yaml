apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-coach-worker
  namespace: devops-coach
  labels:
    app: devops-coach-worker
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-coach-worker
  template:
    metadata:
      labels:
        app: devops-coach-worker
        environment: production
    spec:
      containers:
        - name: devops-coach-worker
          image: prodacrva1ng1.azurecr.io/devops-coach:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - devopscoach.app.celery_app
            - worker
            - -c
            - "2"
            - -l
            - info
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: devops-coach-secrets
                  key: DATABASE_URL
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: devops-coach-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-coach-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: devops-coach-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: devops-coach-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: devops-coach-secrets
                  key: POSTGRES_PORT
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: devops-coach-secrets
                  key: REDIS_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-coach-secrets
                  key: SECRET_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-coach-secrets
                  key: OPENAI_API_KEY
            - name: OPENAI_API_BASE
              valueFrom:
                secretKeyRef:
                  name: devops-coach-secrets
                  key: OPENAI_API_BASE
            - name: OPENAI_MODEL
              valueFrom:
                secretKeyRef:
                  name: devops-coach-secrets
                  key: OPENAI_MODEL
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-coach-secrets
                  key: TAVILY_API_KEY
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
