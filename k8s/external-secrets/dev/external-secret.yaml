# =============================================================================
# ExternalSecret - Fetches secrets from Azure Key Vault
# Syncs secrets from Key Vault to Kubernetes native secrets
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wackops-coach-secrets
  namespace: wackops-coach
spec:
  refreshInterval: 1h  # Sync every hour
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: wackops-coach-secret  # The Kubernetes secret name
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        # PostgreSQL Database (created by Terraform)
        POSTGRES_USER: "{{ .postgres_user }}"
        POSTGRES_PASSWORD: "{{ .postgres_password }}"
        POSTGRES_DB: "{{ .postgres_db }}"
        POSTGRES_HOST: "{{ .postgres_host }}"
        POSTGRES_PORT: "{{ .postgres_port }}"
        DATABASE_URL: "{{ .database_url }}"
        
        # Flask (set by 03-secrets-setup pipeline)
        SECRET_KEY: "{{ .secret_key }}"
        
        # OpenAI/Azure OpenAI (set by 03-secrets-setup pipeline)
        OPENAI_API_KEY: "{{ .openai_api_key }}"
        OPENAI_API_BASE: "{{ .openai_api_base }}"
        OPENAI_MODEL: "{{ .openai_model }}"
        
        # Tavily (set by 03-secrets-setup pipeline)
        TAVILY_API_KEY: "{{ .tavily_api_key }}"
        
        # Redis (set by 03-secrets-setup pipeline)
        REDIS_URL: "{{ .redis_url }}"
  
  data:
    # PostgreSQL secrets (created by Terraform)
    - secretKey: postgres_user
      remoteRef:
        key: postgres-user
    
    - secretKey: postgres_password
      remoteRef:
        key: postgres-password
    
    - secretKey: postgres_db
      remoteRef:
        key: postgres-db
    
    - secretKey: postgres_host
      remoteRef:
        key: postgres-host
    
    - secretKey: postgres_port
      remoteRef:
        key: postgres-port
    
    - secretKey: database_url
      remoteRef:
        key: database-url
    
    # Flask secrets (set by 03-secrets-setup pipeline)
    - secretKey: secret_key
      remoteRef:
        key: secret-key
    
    # OpenAI secrets (set by 03-secrets-setup pipeline)
    - secretKey: openai_api_key
      remoteRef:
        key: openai-api-key
    
    - secretKey: openai_api_base
      remoteRef:
        key: openai-api-base
    
    - secretKey: openai_model
      remoteRef:
        key: openai-model
    
    # Tavily (set by 03-secrets-setup pipeline)
    - secretKey: tavily_api_key
      remoteRef:
        key: tavily-api-key
    
    # Redis (set by 03-secrets-setup pipeline)
    - secretKey: redis_url
      remoteRef:
        key: redis-url
