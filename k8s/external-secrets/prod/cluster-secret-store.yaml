# =============================================================================
# ClusterSecretStore - Connects to Azure Key Vault
# This is a cluster-scoped resource that allows any namespace to fetch secrets
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azurekv:
      authType: ManagedIdentity
      identityId: ""  # Uses AKS kubelet identity
      vaultUrl: "https://wackopscoach-prod-kv.vault.azure.net/"
      serviceManagedIdentity:
        clientId: ""  # Uses system-assigned managed identity
