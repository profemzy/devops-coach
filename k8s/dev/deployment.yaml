apiVersion: apps/v1
kind: Deployment
metadata:
  name: wackops-coach
  namespace: wackops-coach
  labels:
    app: wackops-coach
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wackops-coach
  template:
    metadata:
      labels:
        app: wackops-coach
        environment: dev
    spec:
      containers:
        - name: wackops-coach
          image: devacrva1ng1.azurecr.io/wackops-coach:latest
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wackops-coach-secret
                  key: DATABASE_URL
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: wackops-coach-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wackops-coach-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: wackops-coach-secret
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: wackops-coach-secret
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: wackops-coach-secret
                  key: POSTGRES_PORT
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: wackops-coach-secret
                  key: REDIS_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wackops-coach-secret
                  key: SECRET_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wackops-coach-secret
                  key: OPENAI_API_KEY
            - name: OPENAI_API_BASE
              valueFrom:
                secretKeyRef:
                  name: wackops-coach-secret
                  key: OPENAI_API_BASE
            - name: OPENAI_MODEL
              valueFrom:
                secretKeyRef:
                  name: wackops-coach-secret
                  key: OPENAI_MODEL
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wackops-coach-secret
                  key: TAVILY_API_KEY
            - name: GUNICORN_CMD_ARGS
              value: "--workers 2 --bind 0.0.0.0:8000 --timeout 60"
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
